pre-commit:
  parallel: false
  commands:
    version-and-trufflehog:
      glob: "*"
      run: go run ./cmd/version-stamp && git add -- cmd/feed-subscriber/VERSION && trufflehog filesystem {staged_files} cmd/feed-subscriber/VERSION --results=verified,unknown --exclude-detectors=Lob --fail --no-update --no-color
      env:
        TERM: dumb
        NO_COLOR: "true"
